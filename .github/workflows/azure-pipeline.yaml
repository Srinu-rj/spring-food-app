name: CI-CD Azure Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod
env:
    SONAR_HOST_URL: "http://10.0.2.197:9000"
    NEXUS_URL: "http://10.0.2.87:8081/repository/maven-releases/"
    ARTIFACT_ID: "simple-java-maven-app"
    IMAGE_TAG: ${{ github.run_number }}
    JAVA_VERSION: '21'  # TODO Set the Java Version to 21
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: just a test step
        run: echo "This workflow runs at Every One Hour
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: set-env
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "ACR_REPO=project1appdev.azurecr.io/project1-app-dev" >> $GITHUB_ENV
            echo "CLUSTER_NAME=project1-aks-dev" >> $GITHUB_ENV
            echo "NAMESPACE=project1-dev" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
            echo "ACR_REPO=project1appqa.azurecr.io/project1-app-qa" >> $GITHUB_ENV
            echo "CLUSTER_NAME=project1-aks-qa" >> $GITHUB_ENV
            echo "NAMESPACE=project1-qa" >> $GITHUB_ENV
          else
            echo "ACR_REPO=project1appprod.azurecr.io/project1-app-prod" >> $GITHUB_ENV
            echo "CLUSTER_NAME=project1-aks-prod" >> $GITHUB_ENV
            echo "NAMESPACE=project1-prod" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean install -DskipTests

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_CREDS }}
        run: mvn sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN

      - name: Run Tests
        run: mvn test

      - name: Package Artifact
        run: mvn package

      - name: Deploy to Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          VERSION="1.0.${{ github.run_number }}"
          mvn deploy:deploy-file \
            -DartifactId=${ARTIFACT_ID} \
            -Dversion=${VERSION} \
            -Dpackaging=jar \
            -Dfile=${JAR_FILE} \
            -DrepositoryId=nexus-releases \
            -Durl=${NEXUS_URL} \
            -Dusername=${NEXUS_USER} \
            -Dpassword=${NEXUS_PASS}

      - name: Build Docker Image
        run: |
          JAR_FILE=$(ls target/*.jar | head -n 1)
          echo "FROM openjdk:17-jdk-slim
          COPY ${JAR_FILE} /app/${ARTIFACT_ID}.jar
          ENTRYPOINT [\"java\", \"-jar\", \"/app/${ARTIFACT_ID}.jar\"]" > Dockerfile

          docker build -t $ACR_REPO:${IMAGE_TAG} .
          docker tag $ACR_REPO:${IMAGE_TAG} $ACR_REPO:latest

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_REPO }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASS }}

      - name: Push Docker Image to ACR
        run: |
          docker push $ACR_REPO:${IMAGE_TAG}
          docker push $ACR_REPO:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.CLUSTER_NAME }}-rg
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/${ARTIFACT_ID}-deployment ${ARTIFACT_ID}-container=$ACR_REPO:${IMAGE_TAG} --namespace=$NAMESPACE
          kubectl rollout status deployment/${ARTIFACT_ID}-deployment --namespace=$NAMESPACE

      #TODO 2. Fetch secrets from Key Vault
      - name: Get secrets from Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: myKeyVaultName
          secrets: |
            db-password
            acr-user
            acr-pass

      #TODO 3. Use secrets in your pipeline
      - name: Show secret usage
        run: |
          echo "Database password is ${{ env.DB_PASSWORD }}"
          echo "ACR user is ${{ env.ACR_USER }}"    

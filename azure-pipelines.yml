# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger: none

variables:
  imageRepository: 'spring' # The name of your Docker image in ACR
  dockerRegistryServiceConnection: 'spring-acr' # Your Azure Container Registry service connection name
  aksServiceConnection: 'Azure service connection' # Your AKS cluster service connection name
  helmChartPath: 'helm/my-app' # Path to Helm chart in repo
  storageAccountName : back-up

pool:
  # vmImage: ubuntu-latest
  name: pool

stages:
  - stage: maven_clean
    jobs:
      - job: maven_clean_install
        displayName: 'maven clean'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            goals: 'clean'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false

  - stage: maven_package
    jobs:
      - job: maven_package
        displayName: 'maven package'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false
        
        - task: MicrosoftSecurityDevOps@1
          displayName: 'Test Container Mapping End'
          timeoutInMinutes: 2
          condition: always()
          continueOnError: true

  - stage: Publish_build_artifacts
    jobs:
      - job: Publish_artifacts
        displayName: 'Publish build artifacts'
        steps:
        - checkout: self      
        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'spring'
            publishLocation: 'Container'
          
        - task: DownloadBuildArtifacts@1
          inputs:
            buildType: 'current'
            downloadType: 'specific'
            downloadPath: '$(System.ArtifactsDirectory)'
        
        - task: Bash@3
          inputs:
            targetType: 'inline'
            script: |
              # Write your commands here
              
              echo 'Hello world'
              mkdir outpot
              echo "spring app" > output/apt.txt
              zip -r $(artifactName) output/

        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Pipeline.Workspace)'
            artifact: 'spring'
            publishLocation: 'pipeline'
        - task: AzureCLI@2
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az storage blob upload \
                  --account-name $(storageAccountName) \
                  --container-name $(imageRepository) \
                  --file $(file)
                  --name $(Build.BuildId)-$(artifactName)

        # - task: DownloadBuildArtifacts@1

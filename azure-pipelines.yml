trigger:
  branches:
    include:
      - main
      - production
    exclude: ["master", "feature*", "README.md"]

pool:
  name: pool
  demands:
    - JDK -equals 17
    - Maven -equals Yes
    - Terraform -equals Yes
    - Trivy -equals Yes
    - Node.js -equals Yes
    - Snyk -equals Yes
    - Agent.Name -equals azurepool #TODO Specify the Agent name if you want to run in a particular agent.


variables:
  global_version: "1.0.0"
  global_email: "dnsrinu143@gmail.com"
  # azure_dev_sub: "9ce91e05-4b9e-4a42-95c1-4385c54920c6"
  # azure_prod_sub: "298f2c19-014b-4195-b821-e3d8fc25c2a8"
  isDev: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  isProd: $[eq(variables['Build.SourceBranch'], 'refs/heads/production')]


stages:
  - stage: maven_clean
    condition: and(succeeded(), eq(variables['isDev'], true))
    variables:  #todo optinal
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"        
    jobs:
     - job: maven_clean
       steps:
         - task: Maven@4
           inputs:
             azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
             mavenPomFile: 'pom.xml'
             publishJUnitResults: true
             testResultsFiles: '**/surefire-reports/TEST-*.xml'
             javaHomeOption: 'JDKVersion'
             mavenVersionOption: 'Default'
             mavenAuthenticateFeed: false
             effectivePomSkip: false
             sonarQubeRunAnalysis: false
         - script: echo $(Build.BuildId)
           displayName: "Display The Build-ID"
         - script: mvn clean install 
           displayName: "maven clean install"
         - script: mvn package
           displayName: "packaging the application"
         - script: pwd && ls -al
           displayName: "List Folder & Files"           





# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger: none

pool:
  # vmImage: ubuntu-latest
  name: pool

stages:
  - stage: maven_clean
    jobs:
      - job: maven_clean_install
        displayName: 'maven clean'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            goals: 'clean'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false
          


  - stage: maven_verify
    jobs:
      - job: maven_verify
        displayName: 'maven verify'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            goals: 'verify'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false

  - stage: maven_package
    jobs:
      - job: maven_package
        displayName: 'maven package'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            goals: 'test'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false

  - stage: sonar_server
    jobs:
      - job: sonarqube
        displayName: 'sonar scanner security'
        steps:
        - checkout: self
        - task: SonarQubePrepare@7
          inputs:
            SonarQube: 'sonarserver'
            scannerMode: 'cli'
            cliScannerVersion: '5.0.1.3006'
            configMode: 'file'
            extraProperties: |
              # Additional properties that will be passed to the scanner, 
              # Put one key=value per line, example:
              # sonar.exclusions=**/*.bin
              #sonar.projectKey=my-springboot-app
              #sonar.projectName=Spring Boot App
              #sonar.projectVersion=1.0 
              sonar.projectKey=srinu_srinu_1b4a2efc-bb31-4f14-a18f-d4d93507087c
              sonar.projectName=srinu
        - task: JavaToolInstaller@1
          inputs:
            versionSpec: '17'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'
        - task: SonarQubePublish@7
          inputs:
            pollingTimeoutSec: '300'
        - task: SonarQubeAnalyze@7
          inputs:
            jdkversion: 'JAVA_HOME_17_X64'
        

        


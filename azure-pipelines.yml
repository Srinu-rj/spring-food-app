trigger:
  branches:
    include:
      - master
      - production
    exclude: ["master", "feature*", "README.md","helm"] #

pool:
  name: pool
  # demands:
  #   - Java -equals 17.0.17
  #   - Maven -equals 3.8.7
  #   - Terraform -equals Yes
  #   - Trivy -equals Yes
  #   - Node.js -equals 18.20.8
  #   - Snyk -equals Yes
  #   - Agent.Name -equals raju


variables:
  - group: globel-variables
  - name: version  
    value: "1.0.0"
  - name: email 
    value: "dnsrinu143@gmail.com"
  - name: isDev
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  - name: vd
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/production')]
  - name: dockerRegistryServiceConnection
    value: '25e8c454-3a15-4844-8f5b-c9998fd32ba9' 
  - name: imageRepository
    value: 'application-mysql' #Spring docker image name
  - name: containerRegistory   #AZURE ACR IMAGE NAME
    value: 'spring.azurecr.io'
  - name: dockerfikePath
    value: '${Build.SourceDirectory}/Dockerfile' 
  - name: tag
    value: v1.0.3 #$(Build.BuildId) 


stages:
    # DEV
  - stage: DEV
    pool:
      name: pool # TODO CAN RUN EACH STAGE DIFFERENT AGENT POOL NAME 
    condition: and(succeeded(), eq(variables['isDev'], true))
    variables:  
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"      
    jobs:
      - job: mavan_package
        displayName: 'Create a jar File'
        steps:
          - task: Maven@4
            inputs:
              azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
              mavenPomFile: 'pom.xml'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
              effectivePomSkip: false
              sonarQubeRunAnalysis: false
      - job: Trivy_scanning
        dependsOn: mavan_package
        displayName: 'trivy Scanning '
        condition: always() 
        variables:
          stage_version: "1.0.6"
          stage_email: "dnsrinu143@gmail.com"                    
        steps:         
          - script: pwd && ls -al
            displayName: "List Folder & Files"   
          - script: echo $(Build.BuildId)
            displayName: "Display The Build-ID"       
          - script: trivy fs .
            displayName: 'Scan current directory' 
          - script: trivy repo --branch master https://github.com/Srinu-rj/spring-food-app
            displayName: 'scanning github Repository'   
      - job: ArtifactName
        dependsOn: Trivy_scanning
        condition: always()
        displayName: 'ArtifactName '
        steps: 
          - task: CopyFiles@2
            inputs:
             SourceFolder: '$(System.DefaultWorkingDirectory)'
             Contents: '**'
             TargetFolder: '$(System.DefaultWorkingDirectory)/target'                     
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
      - job: docker_build_and_push
        dependsOn: ArtifactName
        condition: always()
        displayName: 'docker login'
        steps:
          - task: Docker@2
            inputs:
             containerRegistry: 'dockerhub'
             command: 'login'
  
  # TEST
  - stage: TEST
    pool:
      name: pool # TODO CAN RUN EACH STAGE DIFFERENT AGENT POOL NAME 
    condition: and(succeeded(), eq(variables['isDev'], true))
    variables:  
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"      
    jobs:
      - job: mavan_package
        displayName: 'Create a jar File'
        steps:
          - task: Maven@4
            inputs:
              azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
              mavenPomFile: 'pom.xml'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
              effectivePomSkip: false
              sonarQubeRunAnalysis: false
      - job: Trivy_scanning
        dependsOn: mavan_package
        displayName: 'trivy Scanning '
        condition: always() 
        variables:
          stage_version: "1.0.6"
          stage_email: "dnsrinu143@gmail.com"                    
        steps:         
          - script: pwd && ls -al
            displayName: "List Folder & Files"   
          - script: echo $(Build.BuildId)
            displayName: "Display The Build-ID"       
          - script: trivy fs .
            displayName: 'Scan current directory' 
          - script: trivy repo --branch master https://github.com/Srinu-rj/spring-food-app
            displayName: 'scanning github Repository'   
      - job: ArtifactName
        dependsOn: Trivy_scanning
        condition: always()
        displayName: 'ArtifactName '
        steps: 
          - task: CopyFiles@2
            inputs:
             SourceFolder: '$(System.DefaultWorkingDirectory)'
             Contents: '**'
             TargetFolder: '$(System.DefaultWorkingDirectory)/target'                     
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
      - job: docker_build_and_push
        dependsOn: ArtifactName
        condition: always()
        displayName: 'docker login'
        steps:
          - task: Docker@2
            inputs:
             containerRegistry: 'dockerhub'
             command: 'login'  

  # PROD 
  - stage: PROD
    pool:
      name: pool # TODO CAN RUN EACH STAGE DIFFERENT AGENT POOL NAME 
    condition: and(succeeded(), eq(variables['isDev'], true))
    variables:  
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"     
    jobs:
      - job: prod_maven_package
        displayName: 'PROD MAVEN PACKAGE'
        steps:
          - task: Maven@4
            inputs:
              azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
              mavenPomFile: 'pom.xml'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
              effectivePomSkip: false
              sonarQubeRunAnalysis: false




# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger: none

variables:
  imageRepository: 'spring' # The name of your Docker image in ACR
  dockerRegistryServiceConnection: 'spring-acr' # Your Azure Container Registry service connection name
  aksServiceConnection: 'Azure service connection' # Your AKS cluster service connection name
  helmChartPath: 'helm/my-app' # Path to Helm chart in repo

pool:
  # vmImage: ubuntu-latest
  name: pool

stages:
  - stage: maven_clean
    jobs:
      - job: maven_clean_install
        displayName: 'maven clean'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            goals: 'clean'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false

  - stage: maven_package
    jobs:
      - job: maven_package
        displayName: 'maven package'
        steps:
        - checkout: self
        - task: Maven@4
          inputs:
            azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
            mavenPomFile: 'pom.xml'
            goals: 'test'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: 'JDKVersion'
            mavenVersionOption: 'Default'
            mavenAuthenticateFeed: false
            effectivePomSkip: false
            sonarQubeRunAnalysis: false
        
        - task: MicrosoftSecurityDevOps@1
          displayName: 'Test Container Mapping End'
          timeoutInMinutes: 2
          condition: always()

  - stage: Publish_build_artifacts
    jobs:
      - job: Publish_artifacts
        displayName: 'Publish build artifacts'
        steps:
        - checkout: self      
        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'
            publishLocation: 'Container'
        # - task: DownloadBuildArtifacts@1
        #   inputs:
        #     buildType: 'current'
        #     downloadType: 'single'
        #     downloadPath: '$(System.ArtifactsDirectory)'

  # - stage: sonar_server
  #   jobs:
  #     - job: sonarqube
  #       displayName: 'sonar scanner security'
  #       steps:
  #       - checkout: self
  #       - task: SonarQubePrepare@7
  #         inputs:
  #           SonarQube: 'sonarserver'
  #           scannerMode: 'cli'

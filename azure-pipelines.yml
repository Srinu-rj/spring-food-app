trigger: none
  # branches:
  #   include:
  #     - master
  #     - production
  #   exclude: ["master", "feature*", "README.md"]

pool:
  name: pool
  # demands:
  #   - Java -equals 17.0.17
  #   - Maven -equals 3.8.7
  #   - Terraform -equals Yes
  #   - Trivy -equals Yes
  #   - Node.js -equals 18.20.8
  #   - Snyk -equals Yes
  #   - Agent.Name -equals raju


variables:
  global_version: "1.0.0"
  global_email: "dnsrinu143@gmail.com"
  # azure_dev_sub: "9ce91e05-4b9e-4a42-95c1-4385c54920c6"
  # azure_prod_sub: "298f2c19-014b-4195-b821-e3d8fc25c2a8"
  isDev: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  isProd: $[eq(variables['Build.SourceBranch'], 'refs/heads/production')]

stages:
  - stage: maven_clean
    condition: and(succeeded(), eq(variables['isDev'], true))
    variables:  #todo optinal
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"        
    jobs:
     - job: maven_clean
       steps:
         - task: Maven@4
           inputs:
             azureSubscription: 'Azure subscription 1(25e8c454-3a15-4844-8f5b-c9998fd32ba9)'
             mavenPomFile: 'pom.xml'
             publishJUnitResults: true
             testResultsFiles: '**/surefire-reports/TEST-*.xml'
             javaHomeOption: 'JDKVersion'
             mavenVersionOption: 'Default'
             mavenAuthenticateFeed: false
             effectivePomSkip: false
             sonarQubeRunAnalysis: false
         - script: echo $(Build.BuildId)
           displayName: "Display The Build-ID"
         - script: mvn clean install 
           displayName: "maven clean install"
         - script: mvn package
           displayName: "packaging the application"
         - script: pwd && ls -al
           displayName: "List Folder & Files"         

  - stage: atrifact
    condition: and(succeeded(), eq(variables['isDev'], true))
    pool:
     name: pool 
    variables:  
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"   
    jobs:
     - job: atrifact_check
       steps:
          - task: CopyFiles@2
            displayName: "Copy JAR to Staging"
            inputs:
              SourceFolder: 'target'
              Contents: '*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
          - task: Bash@3
            inputs:
              targetType: 'inline'
              script: |
                echo "Renaming JAR to app.jar"
                mv $(Build.ArtifactStagingDirectory)/*.jar $(Build.ArtifactStagingDirectory)/application-mysql.jar
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

          # - task: PublishBuildArtifacts@1
          #   displayName: "Publish Artifact"
          #   inputs:
          #     PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          #     ArtifactName: 'drop'

  - stage: security
    condition: and(succeeded(), eq(variables['isDev'], true))
    pool:
     name: pool 
    variables:  
      stage_version: "1.0.6"
      stage_email: "dnsrinu143@gmail.com"   
    jobs:
     - job: security_check
       steps:
        - script: echo $(Build.BuildId)
          displayName: "Display The Build-ID"       
        - script: trivy fs .
          displayName: 'Scan current directory' 
        - script: trivy repo --branch master https://github.com/Srinu-rj/spring-food-app
          displayName: 'scanning github Repository'

      



